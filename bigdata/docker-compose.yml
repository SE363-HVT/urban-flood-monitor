services:
  kafka:
    # Nâng cấp lên Apache Kafka 4.3.1 (Bản chính thức mới nhất, 100% Pure KRaft mode)
    image: apache/kafka:4.3.1
    container_name: se363-kafka-kraft
    ports:
      - "9092:9092"
    environment:
      # Cấu hình Kafka KRaft Cluster Node ID và vai trò
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Cấu hình Dual-Listener: 9092 cho máy ngoài (Python/Windows), 29092 cho mạng nội bộ Docker (Kafka-UI)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Tối ưu bộ nhớ JVM ở mức 1.0 GB để máy chạy mát mẻ
      KAFKA_HEAP_OPTS: "-Xmx1024m -Xms512m"
    deploy:
      resources:
        limits:
          memory: 1536M
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: se363-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: SE363-Flood-Cluster
      # Kết nối nội bộ tới listener PLAINTEXT_INTERNAL của Kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: se363-redis-serving
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  kafka_data:
    driver: local
